<style>
  :root {
    --ground: #F3F6F4;
    --ink: #0a0a0a;
    --muted: #7c837f;
    --edge: #E8A63B;
    --gap: 24px;
    --pad: 40px;
  }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden;
    background: var(--ground); color: var(--ink);
    font-family: Geist, "Helvetica Neue", Arial, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--ink); }
  .mono { font-family: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

  .pill {
    position: fixed; z-index: 5;
    display: inline-flex; align-items: center; height: 36px; padding: 0 14px;
    border-radius: 999px; background: rgba(243,246,244,0.92); backdrop-filter: blur(8px);
    font-size: 14px; font-weight: 500; text-decoration: none; color: var(--ink);
  }
  .brand { top: 20px; left: 40px; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .brand:hover { color: var(--edge); }
  .contact { top: 20px; right: 40px; background: var(--ink); color: var(--ground); }
  .contact:hover { color: var(--ground); background: #2a2a2a; }
  .caption {
    position: fixed; left: 40px; bottom: 24px; z-index: 5;
    display: flex; flex-direction: column; gap: 6px; padding: 10px 14px;
    border-radius: 10px; background: rgba(243,246,244,0.92); backdrop-filter: blur(8px);
  }
  .caption .kicker { font-size: 11px; letter-spacing: 0.1em; color: var(--edge); }
  .caption .name { font-size: 14px; font-weight: 500; color: var(--ink); }
  .hint { right: 40px; bottom: 24px; top: auto; height: 32px; padding: 0 12px; font-size: 12px; font-weight: 400; color: var(--muted); }

  .wall {
    --cols: 4;
    position: fixed; inset: 0;
    display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
    gap: var(--gap); padding: 0 var(--pad); box-sizing: border-box;
  }
  .col { position: relative; will-change: transform; }
  .col .stack { display: flex; flex-direction: column; gap: var(--gap); }
  .col .stack + .stack { padding-top: var(--gap); }
  .card { display: block; width: 100%; border-radius: 16px; overflow: hidden; background: #e6eae7; cursor: zoom-in; }
  .card img { display: block; width: 100%; height: auto; }

  /* Lightbox */
  .lightbox {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    background: rgba(24,22,20,0.96);
  }
  .lightbox[hidden] { display: none; }
  .lightbox img { max-width: calc(100vw - 120px); max-height: calc(100vh - 80px); width: auto; height: auto; border-radius: 4px; box-shadow: 0 30px 80px rgba(0,0,0,0.5); }
  .lightbox button {
    position: absolute; display: inline-flex; align-items: center; justify-content: center;
    width: 44px; height: 44px; border: 0; border-radius: 999px; cursor: pointer;
    background: rgba(243,246,244,0.12); color: var(--ground);
  }
  .lightbox button:hover { background: rgba(243,246,244,0.24); }
  .lightbox .close { top: 20px; right: 40px; }
  .lightbox .prev { left: 24px; top: 50%; transform: translateY(-50%); }
  .lightbox .next { right: 24px; top: 50%; transform: translateY(-50%); }
  .lightbox .count { position: absolute; left: 40px; bottom: 24px; font-size: 11px; letter-spacing: 0.1em; color: var(--edge); }

  @media (max-width: 720px) {
    :root { --gap: 14px; --pad: 14px; }
    .brand { left: 16px; top: 16px; } .contact { right: 16px; top: 16px; }
    .caption { left: 16px; bottom: 16px; } .hint { display: none; }
    .card { border-radius: 10px; }
    .lightbox img { max-width: 100vw; max-height: calc(100vh - 120px); border-radius: 0; }
    .lightbox .close { right: 16px; top: 16px; }
    .lightbox .prev { left: 12px; top: auto; bottom: 16px; transform: none; }
    .lightbox .next { right: 12px; top: auto; bottom: 16px; transform: none; }
    .lightbox .count { left: 50%; transform: translateX(-50%); bottom: 30px; }
  }
</style>
</head>

<div class="caption">
  <span class="kicker mono">NV 400 · GALLERY</span>
  <span class="name">Photography &amp; videomaking</span>
</div>
<div class="pill hint">Scroll, or wait. Click to enlarge.</div>

<div class="lightbox" id="lightbox" hidden role="dialog" aria-label="Enlarged photograph">
  <img id="lightbox-img" src="" alt="">
  <button class="close" type="button" aria-label="Close"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M5 5l10 10"/><path d="M15 5L5 15"/></svg></button>
  <button class="prev" type="button" aria-label="Previous"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l-6 6 6 6"/></svg></button>
  <button class="next" type="button" aria-label="Next"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4l6 6-6 6"/></svg></button>
  <span class="count mono" id="lightbox-count"></span>
</div>

<script>
(function () {
  var wall = document.getElementById('wall');

  // Gather every card once, reading across the built columns so shoots stay interleaved.
  var seed = Array.prototype.slice.call(wall.querySelectorAll('.col')).map(function (col) {
    return Array.prototype.slice.call(col.querySelector('.stack').children);
  });
  var cards = [];
  var longest = Math.max.apply(null, seed.map(function (s) { return s.length; }));
  for (var r = 0; r < longest; r++) for (var c = 0; c < seed.length; c++) if (seed[c][r]) cards.push(seed[c][r]);
  var fulls = cards.map(function (c) { return c.getAttribute('href'); });

  // Deal the cards into as many columns as the screen has room for. Every card stays on the page.
  var cols = [], n = 0;
  function columnsFor(w) { return w <= 720 ? 2 : w <= 1100 ? 3 : 4; }
  function stack(list, hidden) {
    var s = document.createElement('div'); s.className = 'stack';
    if (hidden) s.setAttribute('aria-hidden', 'true');
    list.forEach(function (card) { s.appendChild(hidden ? card.cloneNode(true) : card); });
    return s;
  }
  var lastWidth = -1;
  function layout() {
    lastWidth = window.innerWidth;
    var want = columnsFor(lastWidth);
    if (want === n) return;
    n = want;
    var lists = [], heights = [];
    for (var i = 0; i < n; i++) { lists.push([]); heights.push(0); }
    cards.forEach(function (card) {
      var img = card.querySelector('img');
      var k = heights.indexOf(Math.min.apply(null, heights));
      lists[k].push(card); heights[k] += img.getAttribute('height') / img.getAttribute('width');
    });
    wall.innerHTML = '';
    wall.style.setProperty('--cols', n);
    cols = lists.map(function (list) {
      var col = document.createElement('div'); col.className = 'col';
      col.appendChild(stack(list, false)); col.appendChild(stack(list, true));
      wall.appendChild(col); return col;
    });
    loadNearby(performance.now() + 1000);
  }
  var resizeTimer;
  window.addEventListener('resize', function () { clearTimeout(resizeTimer); resizeTimer = setTimeout(layout, 150); });

  // Each column drifts at its own pace, so neighbours slide past each other.
  var speeds = [1.0, 1.35, 0.85, 1.15];
  var drift = 18;          // px per second when idle
  var offset = 0;          // shared scroll position, in px
  var velocity = 0;        // leftover from wheel and touch, eased out
  var last = performance.now();
  var paused = false;

  function heightOf(col) { return col.querySelector('.stack').offsetHeight + parseFloat(getComputedStyle(col.querySelector('.stack + .stack')).paddingTop); }

  // Pictures are fetched as they come within 2.5 screens of view, nearest first, so the
  // browser is never busy downloading cards that are still far away.
  var lastCheck = 0;
  function loadNearby(now) {
    if (now - lastCheck < 120) return;
    lastCheck = now;
    var vh = window.innerHeight;
    var imgs = wall.querySelectorAll('img[data-src]');
    for (var i = 0; i < imgs.length; i++) {
      var r = imgs[i].getBoundingClientRect();
      if (r.bottom > -vh && r.top < vh * 2.5) {
        imgs[i].srcset = imgs[i].getAttribute('data-srcset');
        imgs[i].src = imgs[i].getAttribute('data-src');
        imgs[i].removeAttribute('data-src'); imgs[i].removeAttribute('data-srcset');
      }
    }
  }

  layout();

  function frame(now) {
    if (window.innerWidth !== lastWidth) layout();
    loadNearby(now);
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (!paused) {
      offset += drift * dt + velocity * dt;
      velocity *= Math.pow(0.001, dt); // settle within about a second
    }
    for (var i = 0; i < cols.length; i++) {
      var h = heightOf(cols[i]);
      if (h <= 0) continue;
      var y = (offset * speeds[i]) % h;
      if (y < 0) y += h;
      cols[i].style.transform = 'translate3d(0,' + (-y) + 'px,0)';
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  window.addEventListener('wheel', function (e) {
    if (paused) return;
    velocity += e.deltaY * (e.deltaMode === 1 ? 16 : 1) * 6;
  }, { passive: true });

  var touchY = null;
  window.addEventListener('touchstart', function (e) { touchY = e.touches[0].clientY; }, { passive: true });
  window.addEventListener('touchmove', function (e) {
    if (touchY === null || paused) return;
    var dy = touchY - e.touches[0].clientY; touchY = e.touches[0].clientY;
    offset += dy; velocity = dy * 30;
  }, { passive: true });
  window.addEventListener('touchend', function () { touchY = null; });

  // Lightbox: every card links to the full-size file; JS shows it in place instead.
  var box = document.getElementById('lightbox');
  var boxImg = document.getElementById('lightbox-img');
  var count = document.getElementById('lightbox-count');
  var current = 0;

  function show(i) {
    current = (i + fulls.length) % fulls.length;
    boxImg.src = fulls[current];
    var img = cards[current].querySelector('img');
    boxImg.alt = img ? img.alt : '';
    count.textContent = String(current + 1).padStart(2, '0') + ' / ' + String(fulls.length).padStart(2, '0');
    box.hidden = false; paused = true;
  }
  function hide() { box.hidden = true; paused = false; boxImg.src = ''; }

  wall.addEventListener('click', function (e) {
    var card = e.target.closest('.card');
    if (!card) return;
    e.preventDefault();
    show(fulls.indexOf(card.getAttribute('href')));
  });
  box.querySelector('.close').addEventListener('click', hide);
  box.querySelector('.prev').addEventListener('click', function (e) { e.stopPropagation(); show(current - 1); });
  box.querySelector('.next').addEventListener('click', function (e) { e.stopPropagation(); show(current + 1); });
  box.addEventListener('click', function (e) { if (e.target === box) hide(); });

  window.addEventListener('keydown', function (e) {
    if (!box.hidden) {
      if (e.key === 'Escape') hide();
      if (e.key === 'ArrowRight') show(current + 1);
      if (e.key === 'ArrowLeft') show(current - 1);
      return;
    }
    if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') velocity += 900;
    if (e.key === 'ArrowUp' || e.key === 'PageUp') velocity -= 900;
  });
})();
</script>
