<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Open plasmashell bugs</title>
<meta name="description" content="Open plasmashell bug reports on bugs.kde.org over time, updated every minute.">
<style>
body { margin: 0; background: #f6f7f9; color: #6a717a; font: 15px system-ui, sans-serif; }
@media (prefers-color-scheme: dark) { body { background: #15171a; color: #969ca4; } }
p { max-width: 1120px; margin: 0 auto; padding: 22px 16px; }
</style>
</head>
<body>
<p id="msg">Loading…</p>
<script>
// The page itself lives on luna and reads its data from there, so changing it needs no push here.
(function () {
  var SRC = 'https://luna.tail8b3802.ts.net:10000/';
  fetch(SRC, { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function (html) {
      html = html.replace('<meta name="description"', '<meta name="data-base" content="' + SRC + '">\n<meta name="description"');
      document.open(); document.write(html); document.close();
    })
    .catch(function () { document.getElementById('msg').textContent = 'The page could not be loaded. Try again in a minute.'; });
})();
</script>
</body>
</html>
